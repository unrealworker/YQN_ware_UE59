# Reference only: derived from UE's Wasm static-host template; not tested on a live nginx host.
# Include this server block inside nginx's http context. Replace ALL example paths and names.
# Publish only the delivery's Wasm directory. Keep Runtime, Hosting and TLS private keys outside it.
server {
    listen 443 ssl;
    server_name warehouse.example.internal;
    root /srv/ghs/Wasm;                         # Windows example: C:/GHSWeb59/Wasm
    ssl_certificate /etc/ghs/tls/fullchain.pem; # Trusted certificate chain with the server DNS/IP in its SAN
    ssl_certificate_key /etc/ghs/tls/private.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    index index.html;

    # Explicit types include all shipped resources; do not replace this with a Wasm-only types block.
    types {
        application/wasm wasm;
        text/javascript js mjs;
        application/json json;
        application/manifest+json webmanifest;
        text/html html htm;
        text/css css;
        text/plain txt wgsl;
        image/png png;
        image/jpeg jpg jpeg;
        image/gif gif;
        image/webp webp;
        image/svg+xml svg;
        image/x-icon ico;
        font/ttf ttf;
        font/otf otf;
        font/woff woff;
        font/woff2 woff2;
        application/octet-stream bin ini stinfo ushaderbytecode pak ucas utoc;
    }
    default_type application/octet-stream;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Embedder-Policy require-corp always;
    add_header Cross-Origin-Resource-Policy same-origin always;
    add_header Cache-Control no-cache always;
    add_header X-Content-Type-Options nosniff always;

    # This baseline serves original files and preserves byte-range 206 responses, with no extra modules.
    # Do not enable on-the-fly compression for the UE containers. Brotli is provided by the bundled Python server;
    # an nginx Brotli extension requires separate installation and Range/Content-Type validation before use.
    gzip off;
    location ~ /\. { return 404; }
    location ~ \.(br|tmp)$ { return 404; }
    location = /_headers { return 404; }
    location / { try_files $uri $uri/ =404; }
}
